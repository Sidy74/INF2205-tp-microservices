server:
  port: 8083

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5434/ms_commandes_db
    username: fst_user
    password: ${POSTGRES_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  cloud:
    openfeign:
      client:
        config:
          ms-produits:
            connectTimeout: 2000
            readTimeout: 3000