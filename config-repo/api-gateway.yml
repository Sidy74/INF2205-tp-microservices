spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/gestion-commerciale

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: ms-produits
              uri: lb://ms-produits
              predicates:
                - Path=/api/produits/**

            - id: ms-commandes
              uri: lb://ms-commandes
              predicates:
                - Path=/api/commandes/**