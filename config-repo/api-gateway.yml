spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/gestion-commerciale

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: ms-produits
              uri: lb://ms-produits
              predicates:
                - Path=/api/produits/**

            - id: ms-commandes
              uri: lb://ms-commandes
              predicates:
                - Path=/api/commandes/**

            - id: ms-produits-openapi
              uri: lb://ms-produits
              predicates:
                - Path=/produits/v3/api-docs
              filters:
                - RewritePath=/produits/v3/api-docs, /v3/api-docs

            - id: ms-commandes-openapi
              uri: lb://ms-commandes
              predicates:
                - Path=/commandes/v3/api-docs
              filters:
                - RewritePath=/commandes/v3/api-docs, /v3/api-docs

springdoc:
  swagger-ui:
    urls:
      - name: MS Produits
        url: /produits/v3/api-docs
      - name: MS Commandes
        url: /commandes/v3/api-docs