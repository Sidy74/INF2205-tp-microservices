# Configuration de test : désactivation du Config Server
spring.config.import=optional:configserver:
spring.cloud.config.enabled=false

# Base de données PostgreSQL de test
spring.datasource.url=jdbc:postgresql://localhost:5434/ms_commandes_db
spring.datasource.username=fst_user
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Configuration JWT : inutile ici car JwtDecoder est simulé
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/gestion-commerciale

# Désactivation d'Eureka pendant les tests
eureka.client.enabled=false