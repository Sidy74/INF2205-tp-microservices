spring.application.name=ms-commandes-test

# Importer les variables du fichier .env situé à la racine
spring.config.import=optional:file:../.env[.properties]

# Désactiver le Config Server pendant les tests
spring.cloud.config.enabled=false

# Configuration JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/gestion-commerciale

# Connexion PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5434/ms_commandes_db
spring.datasource.username=fst_user
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Désactiver Eureka pendant les tests
eureka.client.enabled=false